name: Public issuer sources
on:
  # Started once daily by Cloudflare at 09:30 Asia/Shanghai.
  workflow_dispatch:
    inputs:
      trigger_origin:
        description: 'Trigger provenance (not a native schedule)'
        type: choice
        options: [manual, cloudflare-watchdog, cloudflare-daily]
        default: manual
permissions:
  contents: write
concurrency:
  group: public-issuer-sources
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/public-sources/collect.py
      - name: Install collector with bounded network retries
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 edgartools==5.62.0; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Restore public data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/atlas-source-data" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/contents/snapshot.json?ref=atlas-source-data" -H 'Accept: application/vnd.github.raw+json' > output/snapshot.json
          fi
      - name: Collect public disclosures
        env:
          ATLAS_EDGAR_IDENTITY: ${{ secrets.ATLAS_EDGAR_IDENTITY }}
        run: python tools/public-sources/collect.py --issuers tools/public-sources/issuers.json --output output/snapshot.json
      - name: Publish public snapshot only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/public-sources/publish.py output/snapshot.json
      - name: Check source health
        run: |
          python -c 'import json; s=json.load(open("output/snapshot.json")); failed=[k for k,v in s["sources"].items() if v["status"]!="ok"]; print("Unavailable sources:",failed); raise SystemExit(bool(failed))'
